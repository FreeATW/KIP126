name: pr-build

# Builds untrusted PR code in a TRUSTED, base-branch-defined workflow. A PR cannot change what
# runs here (pull_request_target uses the base definition). The build/audit configuration
# (lakefile, scripts/, manifest, toolchain) is the TRUSTED base's: we overlay only the PR's
# `KIP126/` sources and validated Lake pins onto a base checkout. Lakefiles remain entirely
# base-trusted; dependency repair PRs carry exact first-known-bad commits only in the manifest.
# Any PR touching anything outside the allowed paths is routed to a human. PR `KIP126/` code
# compiles only under landrun (offline; writes confined to base/.lake; no secrets or token in
# reach). The `build` commit status on the PR head SHA is the required merge check.
#
# The job below is deliberately NOT named `build`: GitHub Actions auto-creates a check-run named
# after the job, and a check-run named `build` would collide with the required `build` STATUS this
# job posts. Branch protection matches the required context `build` against BOTH commit statuses and
# check-runs by name, so two `build` results (a green status + a red job check-run) wedge the PR as
# BLOCKED even though the authoritative build passed — e.g. when the job's final report step exits
# nonzero on a transient "could not list files" (INFRA) hiccup while a healthy re-run posts the green
# status. Keeping the job name distinct leaves exactly one `build` (the status) as the merge gate.
#
# Live on pull_request_target (fires for all PRs, incl. forks, from the trusted base definition).
# workflow_dispatch is also used by branch reconciliation. Its explicit refresh_review input lets a
# reconciled build refresh semantic review without making ordinary ad-hoc rebuilds spend review
# budget; that review then reconciles the PR's status label.
#
# A same-repository PR head may inherit a first-parent ancestor's successful build while the
# committed Lean/build-input digest and the trusted build contract remain byte-for-byte identical.
# The inherited result is still republished as an exact-head `build` status. Anything missing,
# stale, foreign, or ambiguous simply falls back to the normal sandboxed build.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    # Blueprint-only PRs have their own trusted workflow. A reviewer-authored mixed synchronization
    # still runs here: this job builds its Lean delta while blueprint-pr checks the Blueprint delta.
    paths-ignore:
      - "blueprint/src/**"
  # The merge queue tests a batch (one or more PRs combined onto current main) before it lands. We
  # build the COMBINED merge-group commit and post the `build` status on it so the queue's required
  # check is satisfied. The merge-group commit's KIP126/ (all batched PRs) is overlaid onto a
  # freshly-checked-out TRUSTED base — exactly as for a single PR — so the build config stays
  # base-trusted and only KIP126/ code is untrusted, regardless of batch size. A combined diff that
  # reaches outside KIP126/ fails the group (the queue then bisects it); see the scope guard.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to build", required: true, type: string }
      refresh_review:
        description: "Refresh exact-head semantic review after a successful build"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || inputs.pr || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  # Name kept distinct from `build` on purpose — see the header note. The required merge check is the
  # `build` commit STATUS posted in the final step, not this job's auto-created check-run.
  sandboxed-build:
    runs-on: ubuntu-24.04
    env:
      LANDRUN_SHA256: 645178e3239cd33760560834e50efea0864183a2a8a82faf199760dffee6dd71
      LANDRUN_VER: v0.1.14
      # Lake artifact-cache knobs, off by default. The "Configure the Lake artifact cache"
      # step flips these on (and sets LAKE_CACHE_DIR) ONLY when the public cache endpoints
      # are installed as repo variables; until then they stay empty and the build runs
      # exactly as before (a full recompile of KIP126/). Declared here so the landrun
      # build's `--env` list always has a defined value to pass.
      LAKE_ARTIFACT_CACHE: ""
      LAKE_RESTORE_ARTIFACTS: ""
      LAKE_CACHE_DIR: ""
    steps:
      # --- Trusted setup: no PR code runs until the landrun build phase ---
      - name: Resolve PR head
        id: pr
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            # Build the COMBINED merge-group commit (current base + ALL batched PRs, squash-merged by
            # GitHub onto the gh-readonly-queue ref), not any single PR — so a batch is tested as a
            # whole. The combined commit lives in THIS repo; its KIP126/ is overlaid onto the trusted
            # base below, and the required `build` status lands on the merge-group commit.
            REPO='${{ github.repository }}'
            SHA='${{ github.event.merge_group.head_sha }}'
            # Use the IMMUTABLE base SHA the queue synthesized this group on — NOT the mutable `main`
            # tip, which may have advanced since the group was formed. Building the batch's KIP126/
            # over a different base would test (and green-light) the wrong trusted config/pins. This
            # base_sha drives the trusted base checkout, the combined-diff scope compare, and the bump
            # merge-base below.
            BASE_REF='${{ github.event.merge_group.base_sha }}'
            BASE_SHA='${{ github.event.merge_group.base_sha }}'
            STATUS_SHA='${{ github.event.merge_group.head_sha }}'
            NUM="merge-group"   # not a single PR; scope/diff use the combined base..head diff below
            AUTHOR=""           # author was checked before enqueue; strict config validation repeats below
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            NUM='${{ github.event.pull_request.number }}'
            SHA='${{ github.event.pull_request.head.sha }}'
            REPO='${{ github.event.pull_request.head.repo.full_name }}'
            BASE_REF='${{ github.event.pull_request.base.ref }}'
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            STATUS_SHA="$SHA"
            AUTHOR='${{ github.event.pull_request.user.login }}'
          else
            NUM='${{ inputs.pr }}'
            SHA=$(gh api "repos/${{ github.repository }}/pulls/$NUM"  --jq .head.sha)
            REPO=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq .head.repo.full_name)
            BASE_REF=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq .base.ref)
            BASE_SHA=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq .base.sha)
            STATUS_SHA="$SHA"
            AUTHOR=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq .user.login)
          fi
          # Merge-base with the target branch, for the Lake-pin bump validation below:
          # check-bump.sh uses it to scope the PR's own pin delta. owner:sha for forks;
          # `|| true` so a failed substitution does not trip set -e before the fallback;
          # on any miss fall back to the tip (BASE_REF) — at worst the pre-fix behaviour.
          OWNER="${REPO%%/*}"
          MB=$(gh api "repos/${{ github.repository }}/compare/${BASE_REF}...${OWNER}:${SHA}" \
                 --jq '.merge_base_commit.sha' 2>/dev/null || true)
          [ -n "$MB" ] || { MB="$BASE_REF"; echo "::warning::merge-base unresolved; falling back to $BASE_REF tip"; }
          {
            echo "num=$NUM"
            echo "sha=$SHA"
            echo "repo=$REPO"
            echo "base_ref=$BASE_REF"
            echo "base_sha=$BASE_SHA"
            echo "mergebase=$MB"
            echo "status_sha=$STATUS_SHA"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"
          echo "Building PR #$NUM @ $SHA from $REPO on trusted base $BASE_SHA (author=${AUTHOR:-merge-group}, status -> $STATUS_SHA, bump delta vs merge-base $MB)"

      - name: Scope guard — allow KIP126 sources and validated pins
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            # The whole batch's combined change set vs the trusted base (every batched PR).
            files=$(gh api "repos/${{ github.repository }}/compare/${{ steps.pr.outputs.base_ref }}...${{ steps.pr.outputs.sha }}" --jq '.files[].filename')
            # The compare endpoint caps `.files` at 300. If we hit that, the list may be truncated and
            # could hide an out-of-scope path — fail closed (route to human); the queue then bisects the
            # batch into smaller groups that fit under the cap. (Realistic batches are far under 300.)
            if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ]; then
              echo "INFRA=1" >> "$GITHUB_ENV"
              echo "::warning::merge-group combined diff hit the compare 300-file cap — failing closed so the queue bisects"
            fi
          else
            files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.num }}/files" --jq '.[].filename')
          fi
          echo "changed files:"; echo "$files"
          # The root KIP126.lean is allowed alongside KIP126/: it is the (intentionally
          # empty) library root, normally untouched, but a PR may edit it. It is overlaid
          # into the sandbox below and the import-boundary guard covers it. Everything else
          # outside KIP126/ (scripts/, .github/, arbitrary Lake config) stays trusted-base-only and
          # routes to a human. The lakefiles are always human-owned and never overlaid automatically.
          # lake-manifest.json and lean-toolchain are also permitted, but ONLY as a
          # machine-validated forward bump: the "Validate the Lake-pin bump" step below
          # runs the trusted base scripts/check-bump.sh and routes to a human if it is
          # anything other than a forward move (mathlib forward on its nominated branch,
          # transitive pins derived from mathlib, toolchain monotonic).
          if [ -z "$files" ]; then
            echo "INFRA=1" >> "$GITHUB_ENV"; echo "::warning::no files / unable to list — cannot determine the overlay, routing to human"
          elif echo "$files" | grep -vqE '^KIP126/|^KIP126\.lean$|^blueprint/src/|^lake-manifest\.json$|^lean-toolchain$'; then
            if echo "$files" | grep -qE '^lakefile\.toml$'; then
              echo "HUMAN_LAKEFILE=1" >> "$GITHUB_ENV"
            fi
            echo "OUT_OF_SCOPE=1" >> "$GITHUB_ENV"
            echo "::warning::PR changes paths outside KIP126/, Blueprint source, and Lake pins — its KIP126/ is still sandbox-built against the trusted base (so the build result is visible), but merging needs human review"
          elif echo "$files" | grep -qE '^blueprint/src/'; then
            if [ "${{ github.event_name }}" = "merge_group" ]; then
              echo "::notice::merge group contains Blueprint and Lean changes already validated at their PR heads"
            elif echo "$files" | grep -qE '^KIP126/.*\.lean$|^KIP126\.lean$' \
                 && ! echo "$files" | grep -qE '^lake-manifest\.json$|^lean-toolchain$'; then
              echo "MIXED_SYNC=1" >> "$GITHUB_ENV"
              echo "::notice::reviewer mixed synchronization candidate — validating exact parent and authorization"
            else
              echo "OUT_OF_SCOPE=1" >> "$GITHUB_ENV"
              echo "::warning::Blueprint changes may be mixed only with Lean sources through the authorized reviewer synchronization path"
            fi
          elif echo "$files" | grep -qE '^lake-manifest\.json$|^lean-toolchain$'; then
            echo "BUMP=1" >> "$GITHUB_ENV"
            echo "::notice::PR changes Lake pins — validating as a forward bump before building"
          fi
          # The report step runs under `if: always()`. Mark successful completion explicitly so an
          # API or shell failure above cannot be misreported as a green scope decision.
          echo "SCOPE_OK=1" >> "$GITHUB_ENV"

      - name: File count guard — changed files ≤ 2000 (trusted GitHub PR totals)
        # Added and removed line counts are informational; whole-library migrations and paper
        # sources may exceed 2000 lines. Keep the file cap to protect scope-list completeness.
        # The scope guard's 300-file compare cap separately bounds merge-group batches.
        if: ${{ github.event_name != 'merge_group' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # The file-count cap also backstops the scope guard above: the PR files API lists at
          # most 3000 files, so a huge PR could hide an out-of-scope path from that listing.
          # Failing here at 2000 files closes that gap before the API limit is reachable.
          read -r adds dels files < <(gh api "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.num }}" \
            --jq '"\(.additions) \(.deletions) \(.changed_files)"')
          echo "diff size: +$adds / -$dels across $files files (cap: 2000 files; no total line cap)"
          # Fail closed on non-numeric data: [ -gt ] errors on garbage but an `if` would
          # swallow that as false, silently passing the guard.
          if ! [[ "$adds" =~ ^[0-9]+$ && "$dels" =~ ^[0-9]+$ && "$files" =~ ^[0-9]+$ ]]; then
            echo "DIFF_UNKNOWN=1" >> "$GITHUB_ENV"
            echo "::error::could not read the PR's diff totals from the GitHub API (+$adds / -$dels / $files files); failing closed"
            exit 1
          fi
          if [ "$files" -gt 2000 ]; then
            echo "TOO_LARGE=1" >> "$GITHUB_ENV"
            echo "::error::This PR changes $files files (cap: 2000 files). Split it into smaller PRs so the scope guard can inspect every changed path."
            exit 1
          fi

      - name: New-file length guard — newly added .lean files must be ≤ 1000 lines
        # A brand-new file may be at most 1000 lines; an existing file may grow up to the
        # in-build linter ceiling of 1500 (set in lakefile.lean). The split keeps new material
        # small and reviewable while not blocking incremental growth of established files.
        # PR-only, like the file-count guard: new files enter the library through a PR, and a
        # merge_group batch is the sum of already-guarded PRs. For an *added* file the GitHub
        # diff lists every line as an addition, so `.additions` is its line count.
        if: ${{ github.event_name != 'merge_group' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          long=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.num }}/files" \
            --jq '.[] | select(.status == "added" and (.filename | endswith(".lean")) and .additions > 1000)
                      | "\(.filename) (\(.additions) lines)"')
          if [ -n "$long" ]; then
            echo "NEWFILE_TOO_LONG=1" >> "$GITHUB_ENV"
            echo "::error::New .lean files must be at most 1000 lines; these exceed it. Split them, or grow an existing file (allowed up to 1500):"
            echo "$long"
          fi

      - name: Checkout base (trusted)
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        # Pin to the trusted base branch explicitly. For merge_group the event default ref is the
        # untrusted combined commit, so this is what keeps the build config (lakefile, scripts,
        # manifest, toolchain) base-trusted; only KIP126/ is overlaid from the merge-group commit.
        with:
          ref: "${{ steps.pr.outputs.base_sha }}"
          path: base
          persist-credentials: false
          # Enough base history for `lake cache get` to backtrack to a recently-built
          # ancestor commit (its `--max-revs`) when the exact base tip has no cache
          # mapping yet. Harmless (just a slightly deeper fetch) when the cache is off.
          fetch-depth: 100

      - name: Compute the trusted base build-input cache key
        id: base-build-cache-key
        if: ${{ env.INFRA != '1' && env.BUMP != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          digest=$(bash base/scripts/ci-build-cache-key.sh base "${{ steps.pr.outputs.base_sha }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Trusted base build-input digest: $digest"

      # Pin the new build/watchdog scripts to the commit that supplied this
      # workflow. This matters during first rollout and historical manual
      # dispatches, where the PR's base predates those scripts. For normal
      # pull_request_target and merge_group events github.workflow_sha is the
      # trusted base-defined workflow commit, never the candidate checkout.
      - name: Checkout workflow-pinned trusted build tooling
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 1

      - name: Validate authorized reviewer mixed synchronization
        if: ${{ env.MIXED_SYNC == '1' }}
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if python3 gate/scripts/pr_status/cli.py validate-sync \
               --repo '${{ github.repository }}' --pr '${{ steps.pr.outputs.num }}'; then
            echo "MIXED_SYNC_OK=1" >> "$GITHUB_ENV"
          else
            echo "OUT_OF_SCOPE=1" >> "$GITHUB_ENV"
            echo "::warning::mixed synchronization lacks an exact authorized source/recommendation pair"
          fi

      - name: Stage workflow-pinned build tooling into the trusted base
        if: ${{ env.INFRA != '1' }}
        run: |
          set -euo pipefail
          rm -rf base/scripts/perf
          cp -a gate/scripts/perf base/scripts/perf
          cp gate/scripts/Axioms.lean base/scripts/Axioms.lean
          cp gate/scripts/sandbox-build.sh base/scripts/sandbox-build.sh
          rm -f base/scripts/euler-project-gates.sh
          if [[ -f gate/scripts/euler-project-gates.sh ]]; then
            cp gate/scripts/euler-project-gates.sh base/scripts/euler-project-gates.sh
          fi

      - name: Checkout merge-base config (trusted ancestor — only to scope the PR's pin delta)
        if: ${{ env.INFRA != '1' && env.BUMP == '1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.mergebase }}
          path: mergebase
          persist-credentials: false

      - name: Checkout PR head (untrusted, no credentials)
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false
          # A short first-parent history is enough to cross reviewer-only synchronization commits.
          fetch-depth: 21
          # actions/checkout now refuses to fetch fork PR code under
          # pull_request_target unless this opt-in is set. Fetching the fork's
          # sources is exactly this workflow's job; it is safe here because the
          # checkout carries no credentials (persist-credentials: false) and the
          # fork's code is only ever executed under landrun below (offline, no
          # token in reach), never in the trusted context this guard warns about.
          allow-unsafe-pr-checkout: true

      # For a Lake-pin PR, validate it is a safe forward bump BEFORE overlaying its
      # pins or building. The validator and the BASE config it judges against are the
      # TRUSTED current target tip; mergebase/ only scopes the PR's own pin delta; pr/
      # is read as text — no PR code runs. An invalid/backward/forked bump sets INFRA=1
      # → not built, routed to a human. This same inline validation is what the
      # required `bump-guard` status is posted from in the final step (this job owns
      # both required statuses; there is no separate bump-guard workflow).
      - name: Validate the Lake-pin bump (trusted base validator) before building
        if: ${{ env.INFRA != '1' && env.BUMP == '1' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if bash base/scripts/check-bump.sh base mergebase pr; then
            echo "Lake-pin bump validated — building with the PR's pins."
          else
            echo "BUMP_BAD=1" >> "$GITHUB_ENV"
            echo "INFRA=1" >> "$GITHUB_ENV"
            echo "::warning::Lake-pin change is not a validated forward bump — routing to human"
          fi

      # `bump-guard` depends only on the scope decision and the trusted textual pin validator,
      # not on the expensive Mathlib download or Lean build. Publish it now so a normal PR sees
      # this required check finish in seconds rather than waiting roughly eight minutes for the
      # shared job. The final report step refreshes it and retries again if these API calls fail.
      - name: Report bump-guard status immediately after validation
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "${{ env.BUMP_BAD }}" = "1" ]; then
            state=failure; desc="Lake pin change is not a validated forward bump — needs human review"
          elif [ "${{ env.HUMAN_LAKEFILE }}" = "1" ]; then
            state=success; desc="lakefile is not auto-validated — human merge required"
          else
            state=success; desc="validated forward Lake pin bump (or no pin change)"
          fi
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.status_sha }}" \
                 -f state="$state" -f context=bump-guard -f description="$desc" \
                 -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
              echo "posted bump-guard=$state ($desc) to ${{ steps.pr.outputs.status_sha }}"
              exit 0
            fi
            echo "::warning::posting the early bump-guard status failed (attempt $attempt/3)"
            if [ "$attempt" != 3 ]; then sleep $(( attempt * 5 )); fi
          done
          echo "::warning::early bump-guard status could not be posted; the final report step will retry"

      # No-new-set_option guard. `set_option` is an escape hatch (it can raise maxHeartbeats,
      # silence linters, bump maxRecDepth, ...), so candidate code may not introduce one. Compare
      # the untrusted candidate against the trusted base before overlaying it: existing trusted
      # uses are grandfathered, while any added or modified `set_option` line fails closed. This
      # textual diff executes no candidate code and therefore runs safely outside landrun.
      - name: No-new-set_option guard (candidate adds no set_option)
        if: ${{ env.INFRA != '1' }}
        run: |
          set -euo pipefail

          check_no_new_set_option() {
            local trusted="$1" candidate="$2" label="$3" patch status additions
            set +e
            patch=$(git diff --no-index --unified=0 -- "$trusted" "$candidate")
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              echo "::error::could not compare trusted and candidate $label sources"
              exit "$status"
            fi
            additions=$(printf '%s\n' "$patch" | awk '
              /^\+\+\+ / { file=$2; next }
              /^\+[[:space:]]*set_option[[:space:]]/ { print file ": " substr($0, 2) }
            ')
            if [ -n "$additions" ]; then
              echo "$additions"
              echo "::error::$label may not add set_option (it can weaken maxHeartbeats, linters, maxRecDepth, ...); remove it"
              return 1
            fi
          }

          check_no_new_set_option base/KIP126 pr/KIP126 KIP126/
          if [ -e pr/KIP126.lean ]; then
            check_no_new_set_option base/KIP126.lean pr/KIP126.lean KIP126.lean
          fi

      - name: Overlay PR KIP126/ and root KIP126.lean onto the trusted base (reject symlinks)
        if: ${{ env.INFRA != '1' }}
        run: |
          # No symlinks in the untrusted sources (avoid read/write escapes via the build tree).
          if find pr/KIP126 -type l -print | grep -q .; then
            echo "::error::symlinks are not allowed under KIP126/"; exit 1
          fi
          test -d pr/KIP126 && test ! -L pr/KIP126
          rm -rf base/KIP126
          cp -a pr/KIP126 base/KIP126
          # Overlay the root KIP126.lean too (a regular file, never a symlink). Only if
          # the PR actually ships one; otherwise keep the base copy.
          if [ -e pr/KIP126.lean ]; then
            test ! -L pr/KIP126.lean || { echo "::error::KIP126.lean must not be a symlink"; exit 1; }
            cp -a pr/KIP126.lean base/KIP126.lean
          fi
          # For a validated forward bump, overlay the PR's Lake pins too, so the build
          # below actually exercises the new mathlib/toolchain.
          if [ "${BUMP:-}" = "1" ]; then
            for f in lake-manifest.json lean-toolchain; do
              if [ -L "pr/$f" ]; then echo "::error::$f must not be a symlink"; exit 1; fi
              [ -e "pr/$f" ] && cp -a "pr/$f" "base/$f"
            done
          fi
      - name: Import-boundary guard (KIP126/ and KIP126.lean ⊬ roadmap/review)
        if: ${{ env.INFRA != '1' }}
        run: |
          if grep -rIn -E '^[[:space:]]*import[[:space:]]+(KIP126Roadmap|KIP126Review)\b' base/KIP126/ base/KIP126.lean; then
            echo "::error::KIP126/ must not import KIP126Roadmap or KIP126Review"; exit 1
          fi

      - name: Reuse a trusted equivalent first-parent build
        id: inherit-build
        if: ${{ env.INFRA != '1' && github.event_name != 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ steps.pr.outputs.repo }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Attest both the candidate inputs and the trusted machinery that defines the sandboxed
          # build. The 128-bit contract keeps the attestation under GitHub's description limit.
          if ! input=$(bash gate/scripts/ci-build-cache-key.sh pr "$HEAD_SHA"); then
            echo "::warning::could not compute the current build inputs: running the sandboxed build"
            exit 0
          fi
          if ! contract=$(bash gate/scripts/ci-build-contract.sh gate); then
            echo "::warning::could not compute the trusted build contract: running the sandboxed build"
            exit 0
          fi
          attestation="build:v1 input=$input contract=$contract"
          {
            echo "BUILD_INPUT_DIGEST=$input"
            echo "BUILD_CONTRACT=$contract"
            echo "BUILD_ATTESTATION=$attestation"
          } >> "$GITHUB_ENV"

          # Fork ancestors need not be addressable in this repository's trusted status namespace.
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::notice::fork PR: running the sandboxed build"
            exit 0
          fi

          ancestors=$(git -C pr rev-list --first-parent --max-count=20 "$HEAD_SHA^" 2>/dev/null || true)
          if [[ -z "$ancestors" ]]; then
            echo "::notice::no first-parent history is available: running the sandboxed build"
            exit 0
          fi
          for ancestor in $ancestors; do
            ancestor_input=$(bash gate/scripts/ci-build-cache-key.sh pr "$ancestor" 2>/dev/null || true)
            if [[ "$ancestor_input" != "$input" ]]; then
              echo "::notice::build inputs changed at $ancestor: stopping inheritance search"
              break
            fi
            if ! statuses=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ancestor/statuses?per_page=100"); then
              echo "::warning::could not read build statuses at $ancestor: running the sandboxed build"
              break
            fi
            status=$(jq -c '[.[] | select(.context == "build" and .creator.login == "github-actions[bot]")][0] // {}' <<<"$statuses")
            state=$(jq -r '.state // ""' <<<"$status")
            description=$(jq -r '.description // ""' <<<"$status")
            if [[ -z "$state" ]]; then
              continue
            fi
            if [[ "$state" == success && "$description" == "$attestation" ]]; then
              {
                echo "BUILD_REUSED=1"
                echo "BUILD_REUSED_FROM=$ancestor"
              } >> "$GITHUB_ENV"
              echo "::notice::reusing trusted build from ancestor $ancestor (input=$input, contract=$contract)"
            else
              echo "::notice::nearest trusted build evidence at $ancestor is not reusable"
            fi
            # Never jump past a newer trusted red or differently-versioned build result.
            break
          done

      - name: Install elan (trusted)
        if: ${{ env.INFRA != '1' && env.BUILD_REUSED != '1' }}
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          chmod +x elan-init.sh && ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install landrun (pinned + checksum) and self-test (fail closed)
        if: ${{ env.INFRA != '1' && env.BUILD_REUSED != '1' }}
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/Zouuup/landrun/releases/download/${LANDRUN_VER}/landrun-linux-amd64" -o landrun
          echo "${LANDRUN_SHA256}  landrun" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"; install -m 0755 landrun "$HOME/.local/bin/landrun"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          landrun --version || true
          # Prove the sandbox enforces before trusting it with PR code: run works, out-of-tree
          # write denied, /dev/shm write denied, network denied without the flag.
          set +e
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo ok' >/dev/null 2>&1; ok=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /etc/landrun-probe' >/dev/null 2>&1; wr=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /dev/shm/landrun-probe' >/dev/null 2>&1; shm=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'curl -sS --max-time 8 https://example.com >/dev/null' >/dev/null 2>&1; net=$?
          set -e
          echo "self-test: run=$ok write=$wr shm=$shm net=$net (nonzero = denied for w/shm/net)"
          if [ $ok -ne 0 ] || [ $wr -eq 0 ] || [ $shm -eq 0 ] || [ $net -eq 0 ]; then
            echo "::error::landrun not enforcing (run=$ok write=$wr shm=$shm net=$net); refusing to run PR code"; exit 1
          fi

      # `lake exe cache get` runs the `cache` exe built from the pinned Mathlib, unsandboxed,
      # with network (to download oleans) but deliberately NO token in env. For a normal PR that
      # is the trusted base Mathlib. For a validated bump it is the PR's Mathlib pin — which
      # bump-guard proved is a *forward commit on Mathlib's own master* (same repo, never a fork),
      # so the code run here is still trusted Mathlib master under the project's "track master"
      # policy; only the PR's KIP126/ code stays untrusted and runs solely under landrun below.
      - name: Fetch Mathlib with the (bump-validated) config (network, no token; no PR code)
        if: ${{ env.INFRA != '1' && env.BUILD_REUSED != '1' }}
        # `set -o pipefail` is not optional here. A `run:` step with no explicit `shell:`
        # gets the runner default `bash -e {0}`, which does NOT set pipefail, so piping
        # into `tee` would report the pipeline's status as tee's and swallow a failing
        # `cache get` on every PR, not just a bump. Naming the shell also sets pipefail;
        # both are here so neither the tee nor the guard below depends on runner defaults.
        shell: bash
        run: |
          set -o pipefail
          ( cd base && lake exe cache get ) 2>&1 | tee "$GITHUB_WORKSPACE/cache-get.log"
          mkdir -p base/.lake/tmp

      # Backstop to bump-guard's step 2b, measuring the thing itself rather than a proxy.
      # `lake exe cache get` exits 0 on a PARTIAL hit: it prints one warning and the build
      # then quietly recompiles every module whose oleans never arrived. That is invisible
      # in a green build and costs about an hour on every downstream build until the pin
      # moves again, so catch it here (roughly 90 seconds in) rather than after the build.
      #
      # Only a bump is judged. A normal PR builds against the base pin, which it did not
      # choose and cannot fix; failing those would take every PR in the repo down for as
      # long as a bad pin sat on main, which is precisely backwards.
      - name: Require a complete Mathlib cache for a bump
        if: ${{ env.INFRA != '1' && env.BUMP == '1' && env.BUILD_REUSED != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/cache-get.log"
          # Fail closed. An absent or unreadable log is not evidence of a complete cache,
          # and `grep` on a missing file exits 2, which as an `if` condition would read the
          # same as "phrase not found" and wave the bump through.
          if [ ! -r "$log" ]; then
            echo "::error::$log is missing or unreadable, so cache completeness cannot be established for this bump"
            exit 1
          fi
          if grep -qF 'some files were not found in the cache' "$log"; then
            echo "::error::the bump target's Mathlib cache is incomplete, so this pin would make every downstream build recompile the missing modules; bump to a commit whose master-push build published its cache"
            exit 1
          fi
          echo "Mathlib cache is complete at the bump target."

      # Restore only the content-addressed cache produced by successful default-branch CI for the
      # trusted base's committed Lean/build inputs. Documentation-only base commits therefore hit
      # the same archive. PR jobs never write this trusted-main namespace, and pin bumps deliberately
      # skip its reuse; successful same-repository PR outputs use the isolated namespace below.
      - name: Restore trusted build outputs for the base build inputs
        id: main-build-cache
        if: ${{ env.INFRA != '1' && env.BUMP != '1' && env.BUILD_REUSED != '1' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: base/.lake/build
          key: kip126-main-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.base-build-cache-key.outputs.digest }}

      # Enable Lake's built-in artifact cache for the build below ONLY when the public read
      # endpoints are configured (repo variables). Until then this is a no-op: LAKE_*
      # stay empty and the landrun build recompiles KIP126/ from scratch exactly as before.
      # The cache dir lives under base/.lake/ so the offline landrun build (which mounts
      # base/.lake rw) can read what the network `lake cache get` step populates. We never
      # pass the cache *endpoints* into landrun, so the sandboxed build stays offline and
      # can only consult the locally-populated cache.
      - name: Configure the Lake artifact cache (no-op unless the public endpoints are set)
        if: ${{ env.INFRA != '1' && env.BUILD_REUSED != '1' && steps.main-build-cache.outputs.cache-hit != 'true' }}
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: |
          if [ -n "$PUBLIC_ARTIFACT_ENDPOINT" ] && [ -n "$PUBLIC_REVISION_ENDPOINT" ]; then
            {
              echo "LAKE_CACHE_DIR=$PWD/base/.lake/cache"
              echo "LAKE_ARTIFACT_CACHE=true"
              echo "LAKE_RESTORE_ARTIFACTS=true"
              echo "PROJECT_CACHE_ENABLED=1"
            } >> "$GITHUB_ENV"
            echo "::notice::Lake artifact cache enabled — will fetch KIP126's oleans and build incrementally"
          else
            echo "::notice::Lake artifact cache not configured — building KIP126/ from scratch (set the LAKE_CACHE_*_PUBLIC repo variables to enable)"
          fi

      # Anonymous GETs from the PUBLIC read host (a different host than the S3 API endpoint
      # the trusted main upload uses). Looks up KIP126's OWN root-package oleans for the
      # base-branch revision — backtracking up to --max-revs ancestors — and unpacks them
      # into the local Lake cache ($LAKE_CACHE_DIR). This is trusted, main-built data: no
      # token is in reach and no PR code runs (lakefile.lean is declarative + base-trusted).
      # Mathlib's oleans are NOT here; they come from `lake exe cache get` above.
      #
      # A TOTAL miss is non-fatal: the landrun build just recompiles from scratch, as when the
      # cache is off. A PARTIAL fetch is a different matter. `lake cache get` continues past a
      # failed download and exits nonzero (see `lake cache help get`), leaving input-to-output
      # mappings whose artifacts never arrived. The landrun build below is offline and has no
      # cache service configured, so it cannot fetch them: Lake logs a warning per affected
      # module and correctly rebuilds it from source, but `lake build --iofail` is
      # `--fail-level=info`, so those warnings fail a build in which every module compiled.
      # Partial fetches are routine: they cost about a third of merge-group builds their cache.
      # Fixed by https://github.com/leanprover/lean4/pull/14651, landing in v4.34.0-rc1;
      # see https://github.com/SII-MATH/KIP126/issues/2062.
      #
      # Hence: retry from an EMPTY cache each time, then fall back to no cache at all. Retrying
      # over the dirty cache a failed attempt left behind does not work: Lake skips any artifact
      # already on disk, so the retry re-fetches only what is still MISSING and never revisits
      # what the failed attempt got wrong. It then reports clean and the corruption survives
      # into the build. Discarding between attempts is what makes a clean verdict mean the
      # cache is whole; it is affordable because a failing attempt aborts in seconds and a full
      # refetch is ~30s.
      - name: Fetch KIP126's own oleans from the Lake cache (network, no token; no PR code)
        if: ${{ env.INFRA != '1' && env.BUILD_REUSED != '1' && env.PROJECT_CACHE_ENABLED == '1' }}
        env:
          # Passed under non-LAKE_ names so Lake never sees the deprecated endpoint
          # environment variables; we hand it the endpoints through a `--service` config.
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: |
          # Define the public read service in a Lake system config and select it with
          # `--service` (the env-var form of endpoint config is deprecated). Anonymous
          # GETs, so no key here.
          CFG="$RUNNER_TEMP/lake-cache.toml"
          cat > "$CFG" <<TOML
          cache.defaultService = "kip126-public"
          [[cache.service]]
          name = "kip126-public"
          kind = "s3"
          artifactEndpoint = "$PUBLIC_ARTIFACT_ENDPOINT"
          revisionEndpoint = "$PUBLIC_REVISION_ENDPOINT"
          TOML
          # `lake cache get` cannot be judged by exit status alone. Lake accumulates transfer
          # failures into a local `didError` but then tests the stale `s.didError`
          # (Lake/Config/Cache.lean, `if s.didError then failure`), so it can log
          # "failed to download some artifacts" and still exit 0. An attempt therefore counts
          # as clean only if it exits 0 AND logs no failure diagnostic.
          # SIMPLIFY ON THE BUMP TO v4.34.0: that stale read is fixed by
          # https://github.com/leanprover/lean4/pull/14651 ("fix: lake: gracefully handle curl
          # and IO errors during transfer"), which missed v4.33.0-rc2 by hours and was not
          # backported. From v4.34.0-rc1 on, drop FAIL_RE and trust `rc` alone.
          # The purge below outlives that bump: it is for
          # https://github.com/leanprover/lean4/issues/14670, still open.
          # Discarding the cache must never fail the step. A plain `rm -rf` on a directory that
          # Lake's stragglers are still writing into exits 1 with "Directory not empty", and under
          # `set -e` that killed the whole build — worse than the partial cache it was clearing.
          # Rename first (atomic, and unaffected by concurrent writes under the old path), then
          # delete the renamed copy best-effort. What matters for correctness is only that the
          # cache PATH is empty for the next attempt, not that the bytes are reclaimed promptly.
          discard_cache() {
            local d=base/.lake/cache
            [ -e "$d" ] || return 0
            if mv "$d" "$d.discard.$$" 2>/dev/null; then
              rm -rf "$d.discard.$$" 2>/dev/null || true
            else
              rm -rf "$d" 2>/dev/null || true
            fi
            return 0
          }
          # `downloaded artifact hash mismatch` must be here. Lake handles a mismatch by deleting
          # the artifact and setting `didError`, but the stale `didError` read below means the
          # process can still exit 0, and the deletion leaves an input-to-output mapping whose
          # artifact is gone. The offline build cannot refetch it, so that entry becomes a build
          # failure rather than a rebuild. Treat it as unclean so the cache is refetched or dropped.
          FAIL_RE='failed to download|output lookup failed|curl exited with code|downloaded artifact hash mismatch'
          # A revision with no cached build at all is deterministic: retrying cannot change it,
          # and there is nothing partial to discard.
          MISS_RE='no outputs found'
          # Six attempts, not three. Losing every attempt discards the whole cache and forces a
          # ~22 minute full rebuild, which was happening on 4 of 18 sampled builds (the other 14
          # took 2-3 minutes). The cause is lean4#14698: one unreadable artifact throws out of
          # `computeFileHash`, which has no try/catch, so a single ENOENT aborts the entire fetch
          # and discards every artifact already downloaded. Which artifact trips it varies between
          # attempts, so re-fetching genuinely tends to succeed; at the observed per-attempt
          # failure rate six attempts take whole-cache loss from roughly 22% to roughly 5%.
          # Reduce this again once the fix (lean4#14651) reaches a released toolchain: it is on
          # master only, and v4.33.0-rc2 was branched before it landed.
          ATTEMPTS=6
          clean=0
          for attempt in $(seq 1 $ATTEMPTS); do
            LOG="$RUNNER_TEMP/cache-get-$attempt.log"
            rc=0
            ( cd base && LAKE_CONFIG="$CFG" lake cache get --service kip126-public \
                --repo SII-MATH/KIP126 ) > "$LOG" 2>&1 || rc=$?
            cat "$LOG"
            if [ "$rc" = 0 ] && ! grep -qE "$FAIL_RE" "$LOG"; then clean=1; break; fi
            if grep -qE "$MISS_RE" "$LOG"; then break; fi
            # `[ ... ] && sleep` would abort the step under `bash -e` on the last attempt,
            # when the test is false and the whole list returns nonzero. Use a plain `if`.
            if [ "$attempt" != "$ATTEMPTS" ]; then
              echo "::notice::lake cache get attempt $attempt of $ATTEMPTS did not complete cleanly; discarding the partial cache and retrying"
              # Sleep BEFORE discarding. A failed `lake cache get` returns as soon as one transfer
              # errors, while its sibling curl/leantar processes are still writing into the cache
              # dir; discarding at that instant races them. This is no longer a throttling backoff:
              # the read endpoint serves these artifacts byte-identically under 48-way concurrency,
              # so the failures are the Lake bug above rather than rate limiting, and a short fixed
              # pause is enough to let the stragglers finish.
              sleep 10
              # Must precede the retry: see the step comment above. Without this, attempt N+1
              # skips every artifact this attempt already wrote, including the broken ones, and
              # a clean exit from it says nothing about the entries that made this attempt fail.
              discard_cache
            fi
          done
          if [ "$clean" != 1 ]; then
            # Purge on ANY unclean outcome, not just a recognised download failure: an earlier
            # attempt may have written mappings whose artifacts never arrived, and the last
            # attempt's log alone does not witness that. A cache the offline build cannot fully
            # resolve is worse than none, because each unresolvable entry becomes a build
            # failure rather than a rebuild. Discarding it restores the no-cache path exactly.
            echo "::warning::lake cache get did not complete cleanly; discarding the cache and building KIP126/ from scratch"
            discard_cache
            # Empty is NOT off: Lake parses an empty LAKE_ARTIFACT_CACHE as "unspecified" and
            # then defaults artifact-cache reads to true, and an empty LAKE_CACHE_DIR falls back
            # to the workspace's own .lake/cache. Say false explicitly rather than relying on
            # the directory above having just been deleted.
            {
              echo "LAKE_ARTIFACT_CACHE=false"
              echo "LAKE_RESTORE_ARTIFACTS=false"
              echo "LAKE_CACHE_DIR="
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare trusted read-only Lean watchdog toolchain
        if: ${{ env.INFRA != '1' && env.BUILD_REUSED != '1' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          real_lean=$(cd base && elan which lean)
          watchdog="$RUNNER_TEMP/lean-watchdog-toolchain"
          bash base/scripts/perf/prepare-watchdog-toolchain.sh "$watchdog" "$real_lean"
          echo "WATCHDOG_TOOLCHAIN=$watchdog" >> "$GITHUB_ENV"

      - name: Build (trusted config + overlaid KIP126/) under landrun, offline
        id: build
        if: ${{ env.INFRA != '1' && env.BUILD_REUSED != '1' }}
        env:
          # Cold full builds have a trusted baseline module (External.Claims) that normally takes
          # ~225s but has exceeded the watchdog's 300s default under runner contention. Keep a hard
          # per-process deadline, with enough headroom for the required build only; the performance
          # workflow does not receive this override and retains its stricter 300s measurement cap.
          EULER_LEAN_TIMEOUT_SECONDS: "600"
          # The sandboxed build is always offline: never let Lake reach out to a remote
          # cache from inside landrun. When the artifact cache is enabled above, it restores
          # KIP126's oleans purely from the locally-populated $LAKE_CACHE_DIR; when it is
          # not, this is a normal full build. Either way, no network from in here.
          LAKE_NO_CACHE: "true"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.elan/bin:$PATH"
          # The sandboxed build/audit/lint body lives in the TRUSTED base script
          # scripts/sandbox-build.sh (scripts/ routes to a human, so a PR cannot edit it
          # here). Keeping the landrun `bash -c` payload a fixed, comment-free one-liner
          # is deliberate: a comment's apostrophe once closed this single-quoted string
          # early and reddened every PR build (#694). All prose now lives in the script.
          # The marker comes from the trusted sandbox script only after an
          # ordinary build, the axiom audit, and project gates have all passed.
          # Capture it outside landrun, where untrusted Lean code cannot alter
          # the result file; a forged marker can only fail closed into review.
          set -o pipefail
          build_log=$(mktemp "$RUNNER_TEMP/kip126-sandbox-build.XXXXXX")
          landrun --rox /usr --rox /etc \
            --rw /dev/null --rox /dev/zero --rox /dev/urandom --rox /dev/random \
            --rox "$HOME/.elan" --rox "$WATCHDOG_TOOLCHAIN" \
            --rox "$PWD/base" --rw "$PWD/base/.lake" \
            --env PATH --env HOME --env CI \
            --env LAKE_NO_CACHE --env LAKE_ARTIFACT_CACHE --env LAKE_RESTORE_ARTIFACTS --env LAKE_CACHE_DIR \
            --env WATCHDOG_TOOLCHAIN --env EULER_LEAN_TIMEOUT_SECONDS \
            -- bash -euxo pipefail -c 'cd base && exec bash scripts/sandbox-build.sh' 2>&1 | tee "$build_log"
          if grep -qx 'KIP126_WARNING_ONLY_BUILD=1' "$build_log"; then
            echo "BUILD_WARNINGS=1" >> "$GITHUB_ENV"
          fi

      # This separate namespace never feeds the trusted-main cache. It only supplies compiled
      # material to the Blueprint declaration check for a later head with the same attested inputs.
      # The build-inheritance decision above does not depend on this optional cache.
      - name: Save successful same-repository PR outputs for Blueprint checks
        if: ${{ steps.build.outcome == 'success' && steps.pr.outputs.repo == github.repository && env.BUILD_ATTESTATION != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: base/.lake/build
          key: kip126-pr-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUILD_INPUT_DIGEST }}-${{ env.BUILD_CONTRACT }}

      - name: Report build and bump-guard statuses to the PR head commit
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Posting the four statuses is deliberately NOT all-or-nothing. These are four
          # sequential API calls under `set -e`: a single transient error on an early one used to
          # abort the step and leave the commit with a partial set. A MISSING required status is
          # worse than a red one. `build` never appears, so GitHub holds the PR at BLOCKED
          # forever; core.derive reads no `build` status, so labels.py pins the PR at
          # `awaiting-CI` (its ci=None branch) rather than `ci-failed`; and nothing re-runs
          # pr-build without a push, so no event ever corrects it. That wedged PR #1358 for seven
          # days, invisible to both the author path and the review path.
          #
          # So: retry each POST, always attempt all three whatever the others did, and surface a
          # persistent failure loudly at the end rather than silently dropping a status.
          post_fail=0
          post_status() {
            local ctx="$1" st="$2" dsc="$3" attempt
            for attempt in 1 2 3; do
              if gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.status_sha }}" \
                   -f state="$st" -f context="$ctx" -f description="$dsc" \
                   -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
                echo "posted $ctx=$st ($dsc) to ${{ steps.pr.outputs.status_sha }}"
                return 0
              fi
              echo "::warning::posting the $ctx status failed (attempt $attempt/3)"
              if [ "$attempt" != 3 ]; then sleep $(( attempt * 5 )); fi
            done
            # Never propagate the failure as a return code: that would abort this step under
            # `set -e` and skip the statuses not yet posted, which is the bug being fixed.
            echo "::error::could not post the $ctx status to ${{ steps.pr.outputs.status_sha }} after 3 attempts"
            post_fail=1
            return 0
          }

          # bump-guard: this job already ran the trusted base scripts/check-bump.sh inline
          # (the "Validate the Lake-pin bump" step), so we post the required `bump-guard`
          # status from its result here rather than from a separate workflow. This refreshes the
          # early status posted immediately after validation and gives a transient API failure
          # another retry window. BUMP_BAD is set
          # only when a manifest/toolchain change failed that validator; anything else (no pin
          # change, or a validated forward bump) is a pass.
          if [ "${{ env.BUMP_BAD }}" = "1" ]; then
            bg_state=failure; bg_desc="Lake pin change is not a validated forward bump — needs human review"
          elif [ "${{ env.HUMAN_LAKEFILE }}" = "1" ]; then
            bg_state=success; bg_desc="lakefile is not auto-validated — human merge required"
          else
            bg_state=success; bg_desc="validated forward Lake pin bump (or no pin change)"
          fi
          post_status bump-guard "$bg_state" "$bg_desc"

          # build: the real sandboxed-build result ONLY — never a policy verdict. The build now runs even
          # for an out-of-scope PR (its KIP126/ is overlaid onto the trusted base and built), so a red
          # `build` always means the code did not compile or an audit/lint failed, and fix-ci can trust
          # it. It is reported as not-run only when we genuinely could not build: an indeterminate file
          # list (INFRA), an unvalidated pin bump (BUMP_BAD — the overlay would need the PR's pins), or a
          # file-count guard that failed closed (TOO_LARGE / DIFF_UNKNOWN exit before the build). Those
          # post a failure so this required check still blocks merge; the reason lives in `scope` below.
          if [ "${{ env.BUMP_BAD }}" = "1" ] || [ "${{ env.INFRA }}" = "1" ] \
             || [ "${{ env.TOO_LARGE }}" = "1" ] || [ "${{ env.DIFF_UNKNOWN }}" = "1" ]; then
            state=failure; desc="build not run — see the scope check"
          elif [ "${{ env.BUILD_REUSED }}" = "1" ]; then
            state=success; desc="${{ env.BUILD_ATTESTATION }}"
          elif [ "${{ steps.build.outcome }}" = "success" ]; then
            state=success
            if [ -n "${{ env.BUILD_ATTESTATION }}" ]; then
              desc="${{ env.BUILD_ATTESTATION }}"
            else
              desc="sandboxed build, audits, and simp-NF lint passed (trusted config)"
            fi
          else
            state=failure; desc="sandboxed build, audit, or simp-NF lint failed"
          fi
          post_status build "$state" "$desc"

          # warnings: a strict `lake build --iofail` may find warnings even
          # though an ordinary Lean build, the axiom audit, and all project
          # gates pass.  Such a PR satisfies GitHub's required `build` check
          # but is deliberately rejected by the automatic merge gate.  This
          # context is not a repository-required check, so a human reviewer
          # can still place the PR in the merge queue after review.
          if [ "$state" != success ]; then
            warn_state=failure; warn_desc="warning policy unavailable because the build failed"
          elif [ "${{ env.BUILD_WARNINGS }}" = "1" ]; then
            warn_state=failure; warn_desc="Lean build completed with warnings — human review + merge required"
          else
            warn_state=success; warn_desc="Lean build completed without warnings"
          fi
          post_status warnings "$warn_state" "$warn_desc"

          # scope: the merge-policy verdict, posted as its OWN status so a policy issue never hides the
          # build result (the bug this split fixes — an out-of-scope PR used to post its "human review"
          # verdict as a red `build`, so fix-ci churned on it and you could not see whether it compiled).
          # Kept separate from the required GitHub checks so a human-owned infrastructure PR can be
          # merged after review, but required green by TauCetiReview's automatic merge policy. This
          # status is therefore a trusted, fail-closed input to every automatic merge decision.
          if [ "${{ env.SCOPE_OK }}" != "1" ]; then
            sc_state=failure; sc_desc="trusted scope guard did not complete — re-run pr-build"
          elif [ "${{ env.OUT_OF_SCOPE }}" = "1" ]; then
            if [ "${{ env.MIXED_SYNC }}" = "1" ]; then
              sc_state=failure; sc_desc="mixed Lean/Blueprint synchronization is not exactly authorized"
            else
              sc_state=failure; sc_desc="changes outside the automatic source boundary — human review + merge required"
            fi
          elif [ "${{ env.BUMP_BAD }}" = "1" ]; then
            sc_state=failure; sc_desc="Lake pin change failed the trusted bump validator"
          elif [ "${{ env.INFRA }}" = "1" ]; then
            sc_state=failure; sc_desc="could not determine the changed files — human review + merge required"
          elif [ "${{ env.TOO_LARGE }}" = "1" ]; then
            sc_state=failure; sc_desc="diff exceeds 2000 files — split into smaller PRs so every changed path can be checked"
          elif [ "${{ env.DIFF_UNKNOWN }}" = "1" ]; then
            sc_state=failure; sc_desc="could not read PR diff totals from the GitHub API — re-run pr-build"
          elif [ "${{ env.NEWFILE_TOO_LONG }}" = "1" ]; then
            sc_state=failure; sc_desc="a newly added .lean file exceeds 1000 lines — split it (existing files may grow to 1500)"
          else
            sc_state=success; sc_desc="changes are in scope (including an authorized mixed synchronization when present)"
          fi
          post_status scope "$sc_state" "$sc_desc"

          # A status we could not post leaves the commit in the wedged state described above, so
          # fail the job loudly. This runs only after all three have been attempted.
          if [ "$post_fail" = 1 ]; then
            echo "::error::one or more commit statuses are missing; re-run pr-build for this commit"
            exit 1
          fi
          [ "$state" = "success" ]

      - name: Refresh semantic review after a reconciled branch build
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.refresh_review }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]
          gh workflow run review.yml --repo '${{ github.repository }}' --ref main -f pr="$PR" -f retry=true
