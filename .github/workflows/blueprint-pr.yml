name: blueprint-pr

# Trusted-base workflow for untrusted Blueprint source. It never exposes a token to the renderer or
# Lean process. Blueprint-only PRs publish all mechanical contexts. An exactly authorized reviewer
# mixed synchronization publishes only `blueprint`; pr-build remains the sole owner of its shared
# scope/build/bump-guard contexts and builds the Lean side independently.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "blueprint/src/**"
  workflow_dispatch:
    inputs:
      pr: { description: "Blueprint PR number to check", required: true, type: string }

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: blueprint-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  # Deliberately not named `build` or `blueprint`: those authoritative contexts are commit statuses
  # posted below, so GitHub cannot confuse an automatic check-run with the merge-gate status.
  blueprint-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve exact PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ inputs.pr || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            PR="$EVENT_PR"
          else
            [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]]
            PR="$DISPATCH_PR"
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          test "$(jq -r .state "$RUNNER_TEMP/pr.json")" = open
          {
            echo "number=$PR"
            echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
            echo "head_repo=$(jq -r .head.repo.full_name "$RUNNER_TEMP/pr.json")"
            echo "base_sha=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout workflow-pinned trusted projection tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 1

      - name: Classify the source boundary and diff size
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files"
          scope_ok=true
          mixed=false
          reason='Blueprint-only source change'
          if [[ -z "$files" ]]; then
            scope_ok=false
            reason='changed-file list is empty or unavailable'
          elif grep -qvE '^blueprint/src/|^KIP126/.*\.lean$|^KIP126\.lean$' <<<"$files"; then
            scope_ok=false
            reason='change reaches outside Blueprint and Lean source boundaries'
          elif grep -qE '^KIP126/.*\.lean$|^KIP126\.lean$' <<<"$files"; then
            mixed=true
            reason='reviewer mixed synchronization candidate'
          fi

          read -r _additions _deletions changed_files < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '"\(.additions) \(.deletions) \(.changed_files)"'
          )
          # Blueprint source may be a large paper-sized change. Keep the file-count
          # cap so the GitHub file listing remains complete, but do not reject a
          # reviewable Blueprint/Lean synchronization solely for its line count.
          if ! [[ "$changed_files" =~ ^[0-9]+$ ]]; then
            scope_ok=false
            reason='could not read trusted PR changed-file count'
          elif (( changed_files > 2000 )); then
            scope_ok=false
            reason='diff exceeds the 2000-file review cap'
          fi
          {
            echo "ok=$scope_ok"
            echo "mixed=$mixed"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Validate authorized reviewer mixed synchronization
        id: sync
        if: steps.scope.outputs.ok == 'true' && steps.scope.outputs.mixed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 gate/scripts/pr_status/cli.py validate-sync \
            --repo "$GITHUB_REPOSITORY" --pr '${{ steps.pr.outputs.number }}'

      - name: Resolve executable candidate eligibility
        id: eligible
        if: always()
        env:
          SCOPE_OK: ${{ steps.scope.outputs.ok }}
          MIXED: ${{ steps.scope.outputs.mixed }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        shell: bash
        run: |
          if [[ "$SCOPE_OK" == true && ( "$MIXED" != true || "$SYNC_OUTCOME" == success ) ]]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the trusted PR-build contract
        id: build-contract
        if: steps.eligible.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f gate/scripts/ci-build-contract.sh
          digest=$(bash gate/scripts/ci-build-contract.sh gate)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Trusted PR-build contract: $digest"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.eligible.outputs.ok == 'true'
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 100
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # The scope guard proved that the candidate changes only blueprint/src/, so these committed
      # Lean/build inputs are byte-identical to the trusted base and yield its published key.
      - name: Compute the trusted build-input cache key
        id: build-cache-key
        if: steps.eligible.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          digest=$(bash scripts/ci-build-cache-key.sh . HEAD)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Trusted build-input digest: $digest"

      - name: Set up the pinned Blueprint renderer
        if: steps.eligible.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packages=(ghostscript graphviz libgraphviz-dev pdf2svg pkg-config texlive-latex-base)
          sudo timeout --kill-after=10s 180s apt-get -o Acquire::Retries=3 update
          sudo timeout --kill-after=10s 600s apt-get -o Acquire::Retries=3 install --yes "${packages[@]}"
          python3 -m venv "$RUNNER_TEMP/blueprint-venv"
          "$RUNNER_TEMP/blueprint-venv/bin/pip" install -r requirements-blueprint.txt
          echo "$RUNNER_TEMP/blueprint-venv/bin" >> "$GITHUB_PATH"

      - name: Set up Lean without running the Lean project gate
        if: steps.eligible.outputs.ok == 'true'
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Restore trusted Lean outputs for the base build inputs
        id: lean-cache
        if: steps.eligible.outputs.ok == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: base/.lake/build
          key: kip126-main-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-cache-key.outputs.digest }}

      - name: Restore successful PR outputs for the same attested build inputs
        id: pr-lean-cache
        if: steps.eligible.outputs.ok == 'true' && steps.lean-cache.outputs.cache-matched-key == '' && steps.pr.outputs.head_repo == github.repository
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: base/.lake/build
          key: kip126-pr-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-cache-key.outputs.digest }}-${{ steps.build-contract.outputs.digest }}

      - name: Adopt restored Lean outputs
        if: steps.eligible.outputs.ok == 'true' && (steps.lean-cache.outputs.cache-matched-key != '' || steps.pr-lean-cache.outputs.cache-matched-key != '')
        shell: bash
        run: |
          mkdir -p .lake/build
          cp -a base/.lake/build/. .lake/build/

      - name: Restore the checkdecls tool build
        if: steps.eligible.outputs.ok == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages/checkdecls/.lake/build
          key: kip126-checkdecls-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}

      - name: Build Blueprint and verify declaration mappings
        id: blueprint
        if: steps.eligible.outputs.ok == 'true'
        shell: bash
        env:
          # The candidate contributes TeX only. No GitHub token or credential is passed to either
          # process; the checkout has persist-credentials disabled.
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MIXED: ${{ steps.scope.outputs.mixed }}
          LEAN_OUTPUTS_RESTORED: ${{ steps.lean-cache.outputs.cache-matched-key != '' || steps.pr-lean-cache.outputs.cache-matched-key != '' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blueprint-venv/bin/leanblueprint" web
          lake exe cache get
          if [[ "$LEAN_OUTPUTS_RESTORED" != true ]]; then
            echo "::notice::no matching Lean outputs were available; falling back to a local build"
            lake build KIP126
          fi
          lake exe checkdecls blueprint/lean_decls
          test -s blueprint/web/index.html
          test -s blueprint/lean_decls

      - name: Publish exact-head mechanical statuses
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SCOPE_OK: ${{ steps.scope.outputs.ok }}
          ELIGIBLE: ${{ steps.eligible.outputs.ok }}
          MIXED: ${{ steps.scope.outputs.mixed }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
          BLUEPRINT_OUTCOME: ${{ steps.blueprint.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          post_fail=0
          post_status() {
            local context="$1" state="$2" description="$3" attempt
            for attempt in 1 2 3; do
              if gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                   -f state="$state" -f context="$context" -f description="$description" \
                   -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
                return 0
              fi
              [[ "$attempt" == 3 ]] || sleep $(( attempt * 5 ))
            done
            echo "::error::could not publish $context status"
            post_fail=1
          }

          if [[ "$ELIGIBLE" == true ]]; then
            scope_state=success
            scope_desc='Blueprint source boundary and synchronization guard passed'
          else
            scope_state=failure
            if [[ "$MIXED" == true ]]; then
              scope_desc='mixed synchronization lacks exact trusted authorization'
            else
              scope_desc="$SCOPE_REASON"
            fi
          fi
          if [[ "$ELIGIBLE" == true && "$BLUEPRINT_OUTCOME" == success ]]; then
            blueprint_state=success
            blueprint_desc='Blueprint web build and Lean declaration mapping passed'
          else
            blueprint_state=failure
            blueprint_desc='Blueprint mechanical check failed or was not run'
          fi

          post_status blueprint "$blueprint_state" "$blueprint_desc"
          if [[ "$MIXED" != true ]]; then
            post_status scope "$scope_state" "$scope_desc"
            post_status bump-guard success 'not applicable to Blueprint-only source changes'
            post_status build "$blueprint_state" "$blueprint_desc"
          fi
          [[ "$post_fail" == 0 && "$blueprint_state" == success ]]
